[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lessonforge"
version = "0.1.0"
description = "Self-evaluating agentic lesson content generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # LLM gateway
    "litellm>=1.40.0",
    # Typed state & structured output
    "pydantic>=2.7.0",
    # CLI & terminal UX
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Grounding / embeddings
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "tiktoken>=0.7.0",
    # Readability
    "textstat>=0.7.3",
    # Memory
    # sqlite3 is stdlib
    # Retry
    "tenacity>=8.3.0",
    # Rendering
    "jinja2>=3.1.4",
    # Hashing / utils
    "httpx>=0.27.0",
]

[project.scripts]
lessonforge = "lessonforge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-jinja2>=2.11.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
